[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-math-tdcs"
version = "0.1.0"
description = "Reproducible Korean mathematical reasoning post-training with TDCS and Recirculation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "numpy>=1.26",
  "peft>=0.13",
  "PyYAML>=6.0",
  "safetensors>=0.4",
  "sympy>=1.13",
  "antlr4-python3-runtime==4.11.*",
  "torch>=2.4",
  "tqdm>=4.66",
  "transformers>=4.54",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
