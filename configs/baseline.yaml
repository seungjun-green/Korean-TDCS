seed: 42

model:
  name: LGAI-EXAONE/EXAONE-4.0-1.2B
  dtype: auto
  device_map: auto
  attn_implementation: sdpa

formatting:
  eval_enable_thinking: true

evaluation:
  batch_size: 64
  resume: true
  benchmarks: [hrm8k, ko_gsm8k]
  generation:
    max_new_tokens: 512
    do_sample: true
    temperature: 0.6
    top_p: 0.95
  hrm8k:
    dataset: HAERAE-HUB/HRM8K
    subsets: [GSM8K, MATH, OMNI_MATH, MMMLU, KSM]
    split: test
    max_samples: null
  ko_gsm8k:
    dataset: thunder-research-group/SNU_Ko-GSM8K
    split: test
    max_samples: null
output:
  results_path: results/baseline/metrics.json
