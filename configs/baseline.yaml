seed: 42

model:
  name: LGAI-EXAONE/EXAONE-4.0-1.2B
  dtype: auto
  device_map: auto
  attn_implementation: sdpa

formatting:
  eval_enable_thinking: true

evaluation:
  batch_size: 64
  resume: true
  benchmarks: [olympiad_bench_math_ko]
  generation:
    max_new_tokens: 512
    do_sample: true
    temperature: 0.6
    top_p: 0.95
  olympiad_bench_math_ko:
    dataset: ChuGyouk/OlympiadBench-Math-Ko
    split: test
    max_samples: null
output:
  results_path: results/baseline/metrics.json
