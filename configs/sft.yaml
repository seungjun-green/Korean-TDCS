seed: 42

model:
  name: LGAI-EXAONE/EXAONE-4.0-1.2B
  dtype: auto
  attn_implementation: sdpa

data:
  dataset: Seungjun/Korean-Olympiad-TDCS-3K
  format: olympiad_tdcs
  train_split: train
  validation_split: validation

formatting:
  sft_skip_think: false
  eval_enable_thinking: true

training:
  learning_rate: 1.0e-5
  epochs: 4
  max_seq_length: 3072
  effective_batch_size: 32
  micro_batch_size: 16
  expected_example_draws: null
  expected_optimizer_steps: null
  validation_checks_per_epoch: 4
  early_stopping_patience: 4
  early_stopping_min_delta: 0.0
  assistant_only_loss: true
  gradient_checkpointing: true
  max_grad_norm: 1.0
  weight_decay: 0.0
  lr_scheduler_type: constant
  warmup_steps: 0

lora:
  rank: 64
  alpha: 128
  dropout: 0.05
  target_modules: all-linear

difficulty:
  source: difficulty_level
  num_levels: 5
  validate_primary_counts: false

sampling:
  method: random

audit:
  output: results/dataset_audit/olympiad_tdcs_3k_audit.json
  fail_on_truncation: false

output:
  run_dir: results/sft/olympiad_run_002
